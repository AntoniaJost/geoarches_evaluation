ReturnPeriods:
  _target_: metrics.module.ReturnPeriods
  # Extreme value analysis (GEV block maxima) of domain-wide daily extremes.
  # For each variable, the field is reduced to its spatial maximum at every
  # time step, then annual block maxima are pooled across ensemble members
  # and fit to a GEV distribution via scipy. Output: a return-period plot
  # (return level vs. return period, all models overlaid) plus a CSV of the
  # fitted parameters and return levels, organised as:
  #   output_path / time-range / lat-lon / var
  #
  # Optional spatial restriction applied before taking the domain max.
  # A single band:        lat_band: [-30, 30]   (one evaluation pass)
  # Multiple bands:       lat_band: [[-90, -30], [-30, 30], [30, 90]]  (one pass per band)
  # lon_band works the same way: lon_band: [0, 180]  or  lon_band: [[-180,0],[0,180]]
  # Set to null (or omit) to use the full global grid.
  lat_band:
    - null
  lon_band:
    - null
  time:
    #- ["1979-01-01", "2014-12-31"]
  frequency: "daily"
  variables:
    - ["tas", null]
    - ["uv", null]
    #- ["tos", null]
    #- ["ua", 85000]
  return_periods: [2, 5, 10, 20, 50, 100, 200]
  plotter_kwargs:
    output_path: "return_periods"
    figsize: [8, 5]
    dpi: 300
