QuantitativeBaseline:
  _target_: metrics.module.QuantitativeBaseline
  # Model labels whose scores are averaged for the multi-model baseline.
  baseline_models:
    - "CESM2-1-1-HR"
    - "GFDL-CM4-1X1"
    - "HadGEM3-GC31-LL"
    - "MPI-ESM1-2-HR"
  # Scores to compute for every map source.
  scores: ["rmse", "pattern_correlation", "bias"]
  # Each entry points to NetCDF maps produced by an upstream metric.
  # {model_label} is substituted with each model's label at runtime.
